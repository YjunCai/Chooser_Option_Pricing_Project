# =============================================================================
# Chooser Option Pricing -- Week 8 Real-Time Data Auto-Update
# =============================================================================
# The Week-8 pricing tool reuses week7/data_updater.py (same incremental
# merge semantics). This workflow refreshes the training feature dataset on a
# schedule so the deployable tool always prices against the latest market data.
#
# Trigger:
#   - Scheduled: every weekday 06:30 UTC (staggered off the :00 mark)
#   - Manual: GitHub UI -> Actions -> Run workflow
#   - Push: changes to week5-week8 / data / this workflow
#
# If yfinance is rate-limited the updater degrades to the cached snapshot and
# --commit refuses to write simulated data unless --force is passed.
# =============================================================================

name: Week 8 Real-Time Data Update

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/week8_data_update.yml"
      - "week5/**"
      - "week6/**"
      - "week7/**"
      - "week8/**"
      - "week1/data/**"

# Serialize with the other data-refresh workflows so two runs never commit
# the same dataset files at once (avoid "cannot lock ref" push races).
concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r week2/requirements.txt
          pip install -r week5/requirements.txt
          pip install -r week7/requirements.txt

      - name: Refresh feature dataset (updater reused by the Week-8 tool)
        working-directory: week7
        # --force lets the updater commit even if yfinance was rate-limited and
        # it fell back to the cached snapshot (keeps the dataset moving).
        run: python data_updater.py --commit --force

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add week2/data/ week7/output/ week8/output/
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore(data): week8 real-time dataset refresh'
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            pushed=0
            for i in 1 2 3; do
              git merge --abort 2>/dev/null || git rebase --abort 2>/dev/null || true
              git pull --rebase origin main 2>/dev/null || git pull --no-rebase origin main 2>/dev/null || true
              if git push; then pushed=1; break; fi
              sleep 10
            done
            if [ "$pushed" -eq 0 ]; then echo '::error::failed to push after 3 attempts'; exit 1; fi
          fi
